<title>算子工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root {
    --paper: #edf0ea;
    --paper-grid: rgba(43, 89, 195, 0.07);
    --panel: #f7f8f4;
    --mat: #e0e5dc;
    --ink: #18202e;
    --ink-2: #4a5465;
    --ink-3: #6f7989;
    --line: rgba(24, 32, 46, 0.14);
    --line-strong: rgba(24, 32, 46, 0.32);
    --card-bg: #ffffff;
    --shadow: 0 1px 0 rgba(24, 32, 46, 0.08), 0 3px 10px rgba(24, 32, 46, 0.06);
    --scrim: rgba(12, 16, 22, 0.45);
    --c-card: #2b59c3;
    --c-bin: #c0501d;
    --c-un: #8f6200;
    --c-meta: #7a3e9d;
    --c-deck: #0f7b65;
    --c-hole: #97263b;
    --hole-bg: #fbf0f1;
    --on-k: #ffffff;
    --focus: #2b59c3;
    --focus-bg: rgba(43, 89, 195, 0.08);
    --warn-bg: #fbe9e1;
    --warn-ink: #7f2f0f;
    --f-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
    --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", "Noto Serif SC", "Songti SC", serif;
    --f-ui: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161c;
      --paper-grid: rgba(134, 166, 255, 0.06);
      --panel: #181d25;
      --mat: #1f252f;
      --ink: #e6eaf0;
      --ink-2: #b0b9c6;
      --ink-3: #8a94a3;
      --line: rgba(230, 234, 240, 0.14);
      --line-strong: rgba(230, 234, 240, 0.34);
      --card-bg: #212833;
      --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 3px 10px rgba(0, 0, 0, 0.3);
      --c-card: #8aa9ff;
      --c-bin: #ff9466;
      --c-un: #e8bd4f;
      --c-meta: #c99eeb;
      --c-deck: #4fcca8;
      --c-hole: #f28b9a;
      --hole-bg: #2a1e24;
      --on-k: #12161c;
      --focus: #8aa9ff;
      --focus-bg: rgba(138, 169, 255, 0.1);
      --warn-bg: #3a2219;
      --warn-ink: #ffbe9f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161c;
    --paper-grid: rgba(134, 166, 255, 0.06);
    --panel: #181d25;
    --mat: #1f252f;
    --ink: #e6eaf0;
    --ink-2: #b0b9c6;
    --ink-3: #8a94a3;
    --line: rgba(230, 234, 240, 0.14);
    --line-strong: rgba(230, 234, 240, 0.34);
    --card-bg: #212833;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 3px 10px rgba(0, 0, 0, 0.3);
    --c-card: #8aa9ff;
    --c-bin: #ff9466;
    --c-un: #e8bd4f;
    --c-meta: #c99eeb;
    --c-deck: #4fcca8;
    --c-hole: #f28b9a;
    --hole-bg: #2a1e24;
    --on-k: #12161c;
    --focus: #8aa9ff;
    --focus-bg: rgba(138, 169, 255, 0.1);
    --warn-bg: #3a2219;
    --warn-ink: #ffbe9f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--paper); }
  body {
    color: var(--ink);
    font-family: var(--f-ui);
    font-size: 15px;
    line-height: 1.55;
    background-image:
      linear-gradient(var(--paper-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  body.has-sheet { overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; }
  i { font-family: var(--f-math); font-style: italic; }
  p { margin: 0; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 18px 56px;
    display: grid;
    gap: 16px;
  }

  /* 顶栏 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: grid; gap: 2px; }
  .brand h1 {
    margin: 0;
    font-family: var(--f-display);
    font-weight: 900;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: 0.06em;
  }
  .edition { font-size: 12px; letter-spacing: 0.14em; color: var(--ink-3); }
  .codex-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    cursor: pointer;
    font-weight: 600;
  }
  .codex-btn .count { font-family: var(--f-math); font-variant-numeric: tabular-nums; color: var(--c-deck); }

  /* 任务 */
  .quest {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    display: grid;
    gap: 4px;
  }
  .quest-step { font-size: 12px; letter-spacing: 0.08em; color: var(--c-deck); font-weight: 600; }

  /* 合成台 */
  .bench {
    background: var(--mat);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    display: grid;
    gap: 12px;
  }
  .bench-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .bench-title h2 { margin: 0; font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: 0.08em; }
  .bench-title span { font-size: 12px; color: var(--ink-3); }
  .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .slot { display: grid; gap: 6px; align-content: start; }
  .slot-label { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-3); text-align: center; }
  .slot.is-active .slot-label { color: var(--focus); font-weight: 600; }
  .slot-empty {
    width: 100%;
    aspect-ratio: 4 / 5;
    border: 1.5px dashed var(--line-strong);
    border-radius: 10px;
    background: transparent;
    color: var(--ink-3);
    font-size: 12px;
    padding: 6px;
    cursor: pointer;
  }
  .slot.is-active .slot-empty { border-color: var(--focus); color: var(--focus); background: var(--focus-bg); }
  .slot-tip { display: block; margin-top: 6px; font-size: 10.5px; line-height: 1.35; opacity: 0.85; }
  .slot .card::after {
    content: "×";
    position: absolute;
    top: 1px;
    right: 6px;
    font-size: 13px;
    line-height: 1.3;
    color: var(--on-k);
  }
  .bench-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 底板「在……里」：三个格子上方，一整行 */
  .floor { display: flex; align-items: center; gap: 8px; }
  .floor-word { font-family: var(--f-display); font-size: 16px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .floor-word small { font-family: var(--f-ui); font-size: 11px; font-weight: 400; color: var(--ink-3); }
  .floor-slot {
    flex: 1;
    min-width: 0;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 4px 10px;
    border: 1.5px dashed var(--line-strong);
    border-radius: 10px;
    background: transparent;
    color: var(--ink-3);
    font-size: 12px;
    cursor: pointer;
  }
  .floor.is-active .floor-slot { border-color: var(--focus); color: var(--focus); background: var(--focus-bg); }
  .floor.is-active .floor-word { color: var(--focus); }
  .floor.is-set .floor-slot {
    position: relative;
    justify-content: flex-start;
    border: 1px solid var(--line);
    border-left: 5px solid var(--c-deck);
    background: var(--card-bg);
    box-shadow: var(--shadow);
    color: var(--ink);
    padding-right: 26px;
  }
  .floor-name { font-family: var(--f-math); font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
  .floor-sub { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .floor-x { position: absolute; top: 2px; right: 8px; font-size: 13px; color: var(--ink-3); }

  .btn {
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    cursor: pointer;
    font-size: 14px;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 700;
    letter-spacing: 0.2em;
    flex: 1 1 140px;
  }
  .btn-primary[disabled] { opacity: 0.6; cursor: progress; }
  .btn-danger { background: var(--warn-ink); color: var(--paper); border-color: var(--warn-ink); }
  .btn-quiet { border-color: var(--line); color: var(--ink-3); }

  /* 卡牌 */
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    display: flex;
    flex-direction: column;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card-bg);
    box-shadow: var(--shadow);
    overflow: hidden;
    text-align: center;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  button.card:active { transform: translateY(1px) scale(0.98); }
  div.card { cursor: default; }
  .k-card { --k: var(--c-card); }
  .k-bin { --k: var(--c-bin); }
  .k-un { --k: var(--c-un); }
  .k-meta { --k: var(--c-meta); }
  .k-deck {
    --k: var(--c-deck);
    /* 卡组画成一小叠卡 */
    box-shadow: 3px 3px 0 -1px var(--card-bg), 3px 3px 0 0 var(--line-strong), 6px 6px 0 -1px var(--card-bg), 6px 6px 0 0 var(--line), var(--shadow);
  }
  /* 缺口卡：虚线边、淡红底，像是牌堆里缺了一张 */
  .k-hole { --k: var(--c-hole); background: var(--hole-bg); border: 1.5px dashed var(--c-hole); }
  .k-hole.st-filled { border-style: solid; }
  .k-hole .card-main { color: var(--c-hole); }
  /* 角标：可填 / 前沿 / 补不上 / 已填 / 换了类型，放在类型条下面的左上角（右上角留给 i 和 ×） */
  .card-flag {
    position: absolute;
    top: 21px;
    left: 5px;
    z-index: 1;
    font-size: 9.5px;
    line-height: 1.5;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .st-fillable .card-flag { background: var(--c-hole); color: var(--on-k); }
  .st-frontier .card-flag { background: var(--c-meta); color: var(--on-k); }
  .st-unfillable .card-flag { background: var(--card-bg); color: var(--ink-3); border: 1px solid var(--line-strong); }
  .st-filled .card-flag { background: var(--c-deck); color: var(--on-k); }
  .st-retyped .card-flag { background: var(--card-bg); color: var(--c-un); border: 1px solid var(--c-un); }
  .k-hole .card-main { padding-top: 14px; }
  .card-type {
    display: block;
    background: var(--k);
    color: var(--on-k);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    text-align: left;
    white-space: nowrap;
  }
  .card-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 6px;
    font-family: var(--f-math);
    line-height: 1.15;
    overflow-wrap: anywhere;
    color: var(--ink);
  }
  /* 公式包在一层 span 里：flex 只居中这一整块，里面的 <i>x</i> 和文字照常排成一行 */
  .card-main > span { min-width: 0; max-width: 100%; text-align: center; }
  .k-bin .card-main, .k-meta .card-main { color: var(--k); }
  .sz-l { font-size: 32px; }
  .sz-m { font-size: 21px; }
  .sz-s { font-size: 15px; }
  .sz-xs { font-size: 12px; }
  /* 小字最多两行，单位名、卡组全名不再被省略号吃掉 */
  .card-sub {
    font-size: 11px;
    line-height: 1.2;
    color: var(--ink-3);
    padding: 0 6px 7px;
    min-height: 2.2em;
    white-space: normal;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  /* "新"标记排在小字前面，不再盖住文字 */
  .card-new {
    display: inline-block;
    margin-right: 3px;
    vertical-align: 1px;
    line-height: 1.35;
    font-size: 10px;
    font-weight: 700;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--c-deck);
    color: var(--on-k);
  }

  /* 结果 */
  .result {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    gap: 14px;
    align-items: start;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  .result-body { display: grid; gap: 8px; min-width: 0; }
  /* 两栏：得到｜缺口；有缺口时说明文字排到下面整行 */
  .result.has-holes .result-body { grid-column: 1 / -1; }
  .res-col { display: grid; gap: 4px; align-content: start; min-width: 0; }
  .res-h { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-3); }
  .res-holes .res-h { color: var(--c-hole); font-weight: 600; }
  .res-hole-cards { display: grid; grid-template-columns: repeat(auto-fill, 92px); gap: 10px; }
  .res-empty {
    aspect-ratio: 4 / 5;
    display: grid;
    place-items: center;
    padding: 8px;
    border: 1.5px dashed var(--line-strong);
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-3);
    text-align: center;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag.tag-hole { background: var(--c-hole); color: var(--on-k); font-weight: 700; }
  .grade {
    font-size: 12px;
    font-weight: 700;
    padding: 1px 9px;
    border-radius: 999px;
    border: 1.5px solid currentColor;
  }
  .g-auto { color: var(--c-deck); }
  .g-exact { background: var(--c-deck); border-color: var(--c-deck); color: var(--on-k); }
  .g-over { color: var(--c-un); }
  .g-frontier { background: var(--c-meta); border-color: var(--c-meta); color: var(--on-k); }
  /* 比图鉴更紧：和首次发现同一类奖励，同色描边以示区别 */
  .g-tighter { color: var(--c-meta); background: var(--focus-bg); }
  .result.is-fail { display: block; background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .result.is-fail strong { display: block; margin-bottom: 2px; }
  .result-idle { color: var(--ink-3); font-size: 14px; padding-inline: 2px; }
  .tag {
    justify-self: start;
    font-size: 12px;
    padding: 1px 9px;
    border-radius: 999px;
    background: var(--mat);
    color: var(--ink-2);
  }
  .tag-new { background: var(--c-deck); color: var(--on-k); font-weight: 700; }
  .result-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .result-actions .btn { padding: 6px 12px; font-size: 13px; }
  .is-new .res-col .card { animation: pop 0.55s ease-out; }
  @keyframes pop {
    0% { transform: scale(0.8) rotate(-5deg); }
    60% { transform: scale(1.06) rotate(1.5deg); }
    100% { transform: none; }
  }

  /* 手牌 */
  .hand { display: grid; gap: 12px; }
  .hand-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    position: relative;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tab-n { font-family: var(--f-math); font-variant-numeric: tabular-nums; opacity: 0.8; }
  .dot { position: absolute; top: 3px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--c-deck); }
  /* 一行临时提示：缺口放不进底板之类 */
  .hand-tip { padding: 7px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; font-weight: 600; }
  .group { display: grid; gap: 8px; }
  .group + .group { margin-top: 8px; }
  .group-title { margin: 0; font-size: 13px; letter-spacing: 0.1em; color: var(--ink-2); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 14px 12px; }
  .cell { position: relative; }
  .info {
    position: absolute;
    top: 0;
    right: 0;
    width: 30px;
    height: 26px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .info span {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--card-bg);
    color: var(--ink-2);
    font: italic 600 12px/17px var(--f-math);
    text-align: center;
  }
  .muted { color: var(--ink-3); }
  .small { font-size: 13px; }

  /* 底部弹层 */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--scrim);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-panel {
    width: min(760px, 100%);
    max-height: 88%;
    overflow-y: auto;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    display: grid;
    gap: 14px;
    align-content: start;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
  }
  .sheet-panel:focus { outline: none; }
  .sheet-bar { display: flex; justify-content: space-between; gap: 8px; }
  .sheet-bar .btn { padding: 6px 12px; font-size: 13px; }
  .sheet-panel h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 900; letter-spacing: 0.04em; }
  .eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--ink-3); }
  .sub-title { margin: 4px 0 0; font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.06em; }
  .detail { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
  .preview, .formula { font-family: var(--f-math); font-size: 20px; overflow-wrap: anywhere; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    color: var(--ink-2);
    margin-right: 4px;
  }
  .badge-group { border-color: var(--c-deck); color: var(--c-deck); font-weight: 600; }
  .recipes { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-family: var(--f-math); font-size: 17px; }
  .chapter { display: grid; gap: 8px; }
  .chapter h3 { margin: 6px 0 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; }
  .ch-no { color: var(--c-deck); margin-right: 6px; }
  .ch-count { font-family: var(--f-math); font-variant-numeric: tabular-nums; color: var(--c-deck); margin-left: 4px; }
  .chapter.is-locked h3 { color: var(--ink-3); }
  .chapter.is-locked .ch-no { color: var(--ink-3); }
  .locked-note { font-size: 13px; color: var(--ink-2); padding: 10px 12px; border: 1.5px dashed var(--line-strong); border-radius: 12px; }
  .intro { font-size: 14px; color: var(--ink-2); line-height: 1.7; padding-left: 12px; border-left: 3px solid var(--c-deck); max-width: 65ch; }
  .unlock { padding: 8px 12px; border-radius: 10px; background: var(--focus-bg); font-size: 14px; }
  .codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile {
    display: grid;
    gap: 2px;
    align-content: start;
    text-align: left;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1.5px dashed var(--line-strong);
    background: transparent;
    cursor: pointer;
    min-width: 0;
  }
  .tile.is-got { border: 1px solid var(--line); border-top: 4px solid var(--c-deck); background: var(--card-bg); box-shadow: var(--shadow); }
  .tile-sym { font-family: var(--f-math); font-size: 24px; line-height: 1.2; }
  .tile:not(.is-got) .tile-sym { color: var(--ink-3); }
  .tile-name { font-weight: 600; }
  .tile-prev { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
