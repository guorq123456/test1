<title>一个回答的诞生</title>
<style>
/*FONTS*/

  --fg: #1d2420;

  --red: #c4372c;

  --stage-paper: #f2f5ef;
  --stage-ink: #233e91;

  }
}

  --bg: #111714; --surface: #18201c; --fg: #e1e8e2; --muted: #9ba89f;

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 22px; }

<main class="wrap">
  <header class="intro">
    <p class="eyebrow">CLAUDE 讲给大学生的思考过程图解 · 约 6 分钟</p>
    <h1>一个回答的诞生</h1>
    <p class="lede">从你按下发送，到我写出第一个字，中间发生了什么？切词、向量、注意力、逐字预测，再到训练、打草稿和动手做事，全画在一张草稿纸上。</p>
  </header>

      <canvas id="cv" role="img" aria-label="动画画面：Claude 的思考过程图解"></canvas>
      <button class="bigplay" id="bigplay" aria-label="播放">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg>
      </button>
    </div>
    <p class="cc" id="cc" aria-live="polite"></p>
    <div class="controls">
      <div class="scrub">

        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
      <div class="row">
        <button class="ctl play" id="play" type="button">播放</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <label class="hint" for="speed">速度</label>
        <select class="ctl" id="speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>

        </select>
        <button class="ctl" id="voice" type="button" aria-pressed="false">朗读字幕</button>
        <button class="ctl" id="fs" type="button">全屏</button>
      </div>
    </div>
  </section>

  <section class="chapters" aria-labelledby="chap-h">
    <h2 id="chap-h">章节</h2>
    <ol id="chapters"></ol>
  </section>

  <p class="note">画面里的 token 切法、编号、概率和坐标都是示意，用来讲清原理，不是真实模型的内部数据。「朗读字幕」使用你设备自带的中文语音，音色因设备而异。快捷键：空格 播放/暂停，← → 快退/快进 5 秒。</p>
</main>

<script>
(() => {
'use strict';

/* ================================================================
   Stage constants
   ================================================================ */
const W = 1280, H = 720;
const EXPORT = /[?&]export=1/.test(location.search);
if (EXPORT) document.documentElement.classList.add('export');

const C = {
  paper: '#F2F5EF', grid: '#D6E1D6', gridBold: '#BCCDBE',
  ink: '#233E91', inkSoft: '#5C70B3', red: '#C4372C', pencil: '#58605C', text: '#1D2420', white: '#FFFFFF',
  hl: ['rgba(255,210,40,0.55)', 'rgba(255,110,150,0.36)', 'rgba(60,175,230,0.36)',
       'rgba(100,200,100,0.40)', 'rgba(255,145,50,0.42)', 'rgba(150,120,240,0.34)'],
  hlRGB: [[255,214,51], [255,128,165], [86,186,232], [118,204,112], [255,160,72], [160,134,240]],
};
const F = {
  display: '"Noto Serif SC", "Songti SC", "STSong", "Noto Sans SC", serif',
  body: '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif',
  hand: '"Long Cang", "Noto Sans SC", "Kaiti SC", "KaiTi", cursive',
  mono: '"JetBrains Mono", "SFMono-Regular", Menlo, "Noto Sans SC", monospace',
};

/* ================================================================
   Drawing kit (immediate mode, everything is a function of time)
   ================================================================ */
let ctx = null;
let textHook = null;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sum = a => a.reduce((s, v) => s + v, 0);
const E = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  inOut: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const P = (t, start, dur = 0.6, fn = E.out) => fn(clamp((t - start) / dur));
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;

function setFont(kind, size, wt) { ctx.font = `${wt || (kind === 'display' ? 700 : 400)} ${size}px ${F[kind]}`; }
function measure(s, o = {}) { setFont(o.f || 'body', o.size || 28, o.wt); return ctx.measureText(s).width; }
function text(s, x, y, o = {}) {
  if (textHook) textHook(o.f || 'body', s);
  const a = o.alpha ?? 1;
  if (a <= 0.001) return;
  ctx.save();
  setFont(o.f || 'body', o.size || 28, o.wt);
  ctx.fillStyle = o.color || C.text;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha *= a;
  ctx.fillText(s, x, y);
  ctx.restore();
}
/* Handwriting reveal: characters appear in order; layout never shifts. */
function write(s, x, y, k, o = {}) {
  if (textHook) textHook(o.f || 'body', s);
  if (k <= 0) return;
  const chars = Array.from(s);
  const n = chars.length * clamp(k);
  const whole = Math.floor(n);
  const full = measure(s, o);
  const x0 = o.align === 'center' ? x - full / 2 : o.align === 'right' ? x - full : x;
  const shown = chars.slice(0, whole).join('');
  if (shown) text(shown, x0, y, { ...o, align: 'left' });
  if (whole < chars.length && n - whole > 0) {
    text(chars[whole], x0 + measure(shown, o), y, { ...o, align: 'left', alpha: (o.alpha ?? 1) * (n - whole) });
  }
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function box(x, y, w, h, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0.001) return;
  ctx.save();
  ctx.globalAlpha *= a;
  rr(x, y, w, h, o.r ?? 10);
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); }
  ctx.restore();
}
function chip(label, cx, cy, o = {}) {
  const size = o.size || 28, pad = o.pad ?? 16, h = o.h || Math.round(size * 1.75);
  const w = o.width || measure(label, { f: o.f, size, wt: o.wt }) + pad * 2;
  box(cx - w / 2, cy - h / 2, w, h, { fill: o.fill, stroke: o.stroke, lw: o.lw, r: o.r ?? 10, alpha: o.alpha, dash: o.dash });
  text(label, cx, cy + 1, { f: o.f, size, wt: o.wt, color: o.color || C.text, align: 'center', alpha: o.alpha });
  return w;
}
/* Highlighter swipe, multiplied onto the paper like a real marker. */
function marker(x, y, w, h, k, color, seed = 1) {
  k = clamp(k);
  if (k <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = color;
  const ww = w * k, j = h * 0.14;
  ctx.beginPath();
  ctx.moveTo(x, y + rnd(seed) * j);
  ctx.lineTo(x + ww, y + rnd(seed + 1) * j);
  ctx.lineTo(x + ww - 3, y + h - rnd(seed + 2) * j);
  ctx.lineTo(x + 2, y + h - rnd(seed + 3) * j);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function linePts(x0, y0, x1, y1, seed = 1, amp = 1.2, n = 14) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, off = Math.sin(f * Math.PI * 2 + seed) * amp * Math.sin(f * Math.PI);
    pts.push([x0 + dx * f + nx * off, y0 + dy * f + ny * off]);
  }
  return pts;
}
function quadPts(x0, y0, cx, cy, x1, y1, n = 44) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, u = 1 - f;
    pts.push([u * u * x0 + 2 * u * f * cx + f * f * x1, u * u * y0 + 2 * u * f * cy + f * f * y1]);
  }
  return pts;
}
function arcPts(cx, cy, r, a0, a1, n = 48) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
/* A hand-drawn loop: slightly more than one turn, slowly widening. */
function ellipsePts(cx, cy, rx, ry, seed = 1) {
  const pts = [], n = 64, start = -2.5;
  for (let i = 0; i <= n; i++) {
    const f = i / n, a = start + f * Math.PI * 2 * 1.1;
    const wob = 1 + 0.035 * Math.sin(f * 9 + seed) + 0.06 * f;
    pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob]);
  }
  return pts;
}
function strokePts(pts, k = 1, o = {}) {
  k = clamp(k);
  if (k <= 0 || pts.length < 2) return null;
  ctx.save();
  ctx.strokeStyle = o.color || C.ink;
  ctx.lineWidth = o.width || 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.dash) ctx.setLineDash(o.dash);
  const seg = [];
  let L = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    seg.push(d); L += d;
  }
  let rem = L * k, tip = pts[0], ang = 0;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < seg.length; i++) {
    const a = pts[i], b = pts[i + 1];
    if (seg[i] > 0.01) ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (rem >= seg[i]) { ctx.lineTo(b[0], b[1]); tip = b; rem -= seg[i]; }
    else { const f = seg[i] ? rem / seg[i] : 0; tip = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; ctx.lineTo(tip[0], tip[1]); break; }
  }
  ctx.stroke();
  ctx.restore();
  return { x: tip[0], y: tip[1], ang };
}
function head(x, y, ang, o = {}) {
  const s = o.size || 13;
  ctx.save();
  ctx.strokeStyle = o.color || C.ink;
  ctx.lineWidth = o.width || 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.beginPath();
  ctx.moveTo(x - s * Math.cos(ang - 0.45), y - s * Math.sin(ang - 0.45));
  ctx.lineTo(x, y);
  ctx.lineTo(x - s * Math.cos(ang + 0.45), y - s * Math.sin(ang + 0.45));
  ctx.stroke();
  ctx.restore();
}
function arrowPts(pts, k, o = {}) { const tip = strokePts(pts, k, o); if (tip && k > 0.04) head(tip.x, tip.y, tip.ang, o); }
function arrow(x0, y0, x1, y1, k, o = {}) { arrowPts(linePts(x0, y0, x1, y1, o.seed || 1, o.amp ?? 1.2), k, o); }
function check(x, y, s, k, o = {}) {
  strokePts([[x - s * 0.5, y], [x - s * 0.12, y + s * 0.4], [x + s * 0.55, y - s * 0.45]], k, { color: o.color || C.ink, width: o.width || 4, alpha: o.alpha });
}
function cross(x, y, s, k, o = {}) {
  const c = o.color || C.red, w = o.width || 5;
  strokePts([[x - s / 2, y - s / 2], [x + s / 2, y + s / 2]], clamp(k * 2), { color: c, width: w });
  strokePts([[x + s / 2, y - s / 2], [x - s / 2, y + s / 2]], clamp(k * 2 - 1), { color: c, width: w });
}
function dot(x, y, r, color, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function bubble(label, cx, cy, w, h, a, side, o = {}) {
  if (a <= 0) return;
  const x = cx - w / 2, y = cy - h / 2, fill = o.fill || C.white, stroke = o.stroke || C.ink;
  ctx.save();
  ctx.globalAlpha *= a;
  rr(x, y, w, h, 16);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
  const tx = side === 'left' ? x + 34 : x + w - 34, dir = side === 'left' ? -1 : 1;
  ctx.beginPath();
  ctx.moveTo(tx - 10, y + h - 1.5); ctx.lineTo(tx + dir * 16, y + h + 16); ctx.lineTo(tx + 10, y + h - 1.5); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(tx - 10, y + h); ctx.lineTo(tx + dir * 16, y + h + 16); ctx.lineTo(tx + 10, y + h);
  ctx.stroke();
  ctx.restore();
  text(label, cx, cy + 1, { size: o.size || 26, color: o.color || C.text, align: 'center', alpha: a, wt: o.wt });
}
function wrapText(s, maxW, o) {
  const out = [];
  let cur = '';
  for (const ch of Array.from(s)) {
    const next = cur + ch;
    if (measure(next, o) > maxW && cur) {
      if ('，。、；：？！）」'.includes(ch)) { cur = next; continue; }
      out.push(cur); cur = ch;
    } else cur = next;
  }
  if (cur) out.push(cur);
  return out;
}
function vcell(x, y, w, h, v, a) {
  const col = v < 0 ? `rgba(35,62,145,${(0.15 + Math.abs(v) * 0.75).toFixed(3)})` : `rgba(214,96,44,${(0.15 + v * 0.75).toFixed(3)})`;
  box(x, y, w, h, { fill: col, r: 3, alpha: a });
}

/* ================================================================
   Scenes. Each draw(t, c) gets local time t and the start times c[]
   of its captions, so the animation stays in step with the words.
   ================================================================ */
const SCENES = [];

/* ---------- 0 · 开场 ---------- */
SCENES.push({
  chapter: '开场',
  caps: [
    '嗨，我是 Claude。',
    '你问我一个问题，几秒钟后我给出回答。中间到底发生了什么？',
    '这次我把整个过程画在草稿纸上，一步一步讲给你听。',
  ],
  draw(t, c) {
    const title = '一个回答的诞生';
    const tw = measure(title, { f: 'display', size: 96 });
    marker(640 - tw / 2 - 16, 214, tw + 32, 46, P(t, 1.5, 0.7, E.inOut), C.hl[0], 3);
    write(title, 640, 192, P(t, 0.3, 1.2, E.lin), { f: 'display', size: 96, color: C.ink, align: 'center' });
    text('Claude 讲给大学生的思考过程图解', 640, 280, { size: 28, color: C.pencil, align: 'center', alpha: P(t, 1.9, 0.6) });

    const q = '期末考试前一晚，最重要的是？', ans = '睡好觉！';
    const o = { size: 26 };
    const wq = measure(q, o) + 48, wa = measure(ans, o) + 48, wb = 190, gap = 100, y = 478;
    const total = wq + wb + wa + gap * 2;
    const x0 = 640 - total / 2;

    if (t > last.flyAt + last.flyDur && Math.floor(t * 2.2) % 2 === 0) box(endX + 6, yL - 20, 3, 40, { fill: C.ink, r: 1 });

});

        ctx.fillStyle = C.ink; ctx.fillRect(ix - 20, iy - 17, 40, 10);
        text('31', ix, iy + 9, { f: 'mono', size: 15, wt: 600, color: C.ink, align: 'center' });
      }
      const bo = { size: 23 };
      wrapText(cd.body, w - 52, bo).forEach((ln, j) => text(ln, -w / 2 + 26, -h / 2 + 118 + j * 38, { ...bo, color: C.text }));
      ctx.restore();
    });
  },
});

/* ---------- 10 · 回顾 ---------- */
SCENES.push({
  chapter: '回顾', title: '回顾',
  caps: [
    '回顾一下：切成 token、变成向量、互相注意、层层加工、预测下一个，再一个个写出来。',
    '训练让我学会这些；草稿让推理更稳；工具让我能动手。',
    'AI 是好用的工具，但最好的思考，永远是你自己的。我们下次见！',
  ],
  hold: [1.0, 0.8, 0],
  extra: 3.0,
  last: true,
  draw(t, c) {
    const steps = ['切词', '向量', '注意力', '层层加工', '预测下一个'];
    const o = { size: 30, wt: 700 }, gap = 74, y = 214;
    const ws = steps.map(s => measure(s, o) + 36);
    const xs = [];
    let x = 640 - (sum(ws) + gap * (steps.length - 1)) / 2;
    ws.forEach(w => { xs.push(x + w / 2); x += w + gap; });
    steps.forEach((s, i) => {
      const k = P(t, c[0] + 0.5 + i * 1.15, 0.45, E.back);
      chip(s, xs[i], y, { ...o, fill: C.hl[i], width: ws[i], alpha: clamp(k) });
      if (i > 0) arrow(xs[i - 1] + ws[i - 1] / 2 + 12, y, xs[i] - ws[i] / 2 - 12, y, P(t, c[0] + 0.3 + i * 1.15, 0.35), { color: C.pencil, width: 2.5, size: 10 });
    });
    const kl = P(t, c[0] + 6.4, 0.9, E.inOut);
    arrowPts(quadPts(xs[4], y + 32, 640, y + 170, xs[0], y + 32), kl, { color: C.red, width: 3 });
    text('写出一个，接回去，再来', 640, y + 116, { f: 'hand', size: 30, color: C.red, align: 'center', alpha: P(t, c[0] + 7.0, 0.5) });

    ['训练 · 学会这些', '草稿 · 推理更稳', '工具 · 能动手'].forEach((s, i) => {
      chip(s, 340 + i * 300, 392, { size: 26, fill: C.white, stroke: C.ink, color: C.ink, alpha: P(t, c[1] + 0.4 + i * 1.3, 0.5) });
    });
    const fin = '最好的思考，永远是你自己的。';
    const fo = { f: 'display', size: 54 };
    const fw = measure(fin, fo);
    marker(640 - fw / 2 - 12, 504, fw + 24, 30, P(t, c[2] + 2.2, 0.8, E.inOut), C.hl[0], 9);
    write(fin, 640, 494, P(t, c[2] + 0.6, 1.4, E.lin), { ...fo, color: C.ink, align: 'center' });
    text('—— Claude', 1180, 562, { f: 'display', size: 30, color: C.red, align: 'right', alpha: P(t, c[2] + 3.0, 0.6) });
  },
});

/* ================================================================
   Timeline
   ================================================================ */
const LEAD = 0.8, TAIL = 0.9;
let TOTAL = 0;
SCENES.forEach((s, idx) => {
  s.idx = idx;
  s.start = TOTAL;
  s.cues = [];
  let t = LEAD;
  s.caps.forEach((cap, i) => {
    const d = Math.max(2.8, 1.1 + Array.from(cap).length / 5) + (s.hold?.[i] || 0);
    s.cues.push({ t, d, text: cap });
    t += d;
  });
  s.dur = t + TAIL + (s.extra || 0);
  TOTAL += s.dur;
});
function sceneAt(time) {
  for (let i = SCENES.length - 1; i >= 0; i--) if (time >= SCENES[i].start) return SCENES[i];
  return SCENES[0];
}
function cueOf(s, lt) {
  for (let i = 0; i < s.cues.length; i++) { const q = s.cues[i]; if (lt >= q.t && lt < q.t + q.d) return { ...q, i }; }
  return null;
}

/* ================================================================
   Frame
   ================================================================ */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
ctx = cv.getContext('2d');
let scale = 1, paper = null, wideCaptions = true;

function makePaper() {
  paper = document.createElement('canvas');
  paper.width = cv.width; paper.height = cv.height;
  const p = paper.getContext('2d');
  p.scale(scale, scale);
  p.fillStyle = C.paper; p.fillRect(0, 0, W, H);
  p.lineWidth = 1;
  for (let x = 0; x <= W; x += 24) {
    p.strokeStyle = x % 120 === 0 ? C.gridBold : C.grid;
    p.beginPath(); p.moveTo(x + 0.5, 0); p.lineTo(x + 0.5, H); p.stroke();
  }
  for (let y = 0; y <= H; y += 24) {
    p.strokeStyle = y % 120 === 0 ? C.gridBold : C.grid;
    p.beginPath(); p.moveTo(0, y + 0.5); p.lineTo(W, y + 0.5); p.stroke();
  }
}
function fit() {
  if (EXPORT) { cv.width = 1920; cv.height = 1080; scale = 1.5; wideCaptions = true; makePaper(); return; }
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(320, Math.round(r.width * dpr));
  cv.width = cw; cv.height = Math.round(cw * 9 / 16);
  scale = cv.width / W;
  wideCaptions = r.width >= 640;
  document.getElementById('cc').classList.toggle('wide', wideCaptions);
  makePaper();
}
function header(s, t) {
  if (!s.title) return;
  const x = s.num ? 128 : 72;
  if (s.num) {
    strokePts(ellipsePts(88, 64, 25, 23, s.num), P(t, 0.05, 0.5, E.inOut), { color: C.red, width: 2.6 });
    text(String(s.num), 88, 66, { f: 'mono', size: 26, wt: 600, color: C.red, align: 'center', alpha: P(t, 0.2, 0.4) });
  }
  write(s.title, x, 64, P(t, 0.15, 0.8, E.lin), { f: 'display', size: 40, color: C.ink });
}
function progressDots(idx) {
  const n = SCENES.length, x0 = 1222 - (n - 1) * 18;
  for (let i = 0; i < n; i++) dot(x0 + i * 18, 62, i === idx ? 6 : 4, i <= idx ? C.ink : C.gridBold, i < idx ? 0.5 : 1);
}
function splitCaption(s, maxW, o) {
  if (measure(s, o) <= maxW) return [s];
  const ch = Array.from(s), mid = ch.length / 2;
  let best = -1, bestD = 1e9;
  ch.forEach((c, i) => {
    if ('，。：；？！、'.includes(c) && i < ch.length - 1) { const d = Math.abs(i + 1 - mid); if (d < bestD) { bestD = d; best = i + 1; } }
  });
  if (best < 0 || bestD > ch.length * 0.3) best = Math.ceil(mid);
  return [ch.slice(0, best).join(''), ch.slice(best).join('')];
}
function drawCaption(s, a) {
  if (a <= 0) return;
  const o = { size: 28 };
  const lines = splitCaption(s, 1080, o);
  const lh = 40, padY = 13;
  const bw = Math.max(...lines.map(l => measure(l, o))) + 56, bh = lines.length * lh + padY * 2;
  const y = H - 22 - bh;
  box(640 - bw / 2, y, bw, bh, { fill: 'rgba(255,255,255,0.9)', stroke: C.gridBold, lw: 1.5, r: 12, alpha: a });
  lines.forEach((l, i) => text(l, 640, y + padY + lh / 2 + i * lh + 1, { ...o, align: 'center', color: C.text, alpha: a }));
}
function render(time, poster = false) {
  time = clamp(time, 0, TOTAL - 1e-4);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(paper, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const s = sceneAt(time), t = time - s.start;
  const fade = Math.min(P(t, 0, 0.5, E.inOut), s.last ? 1 : 1 - P(t, s.dur - 0.5, 0.5, E.inOut));
  ctx.save();
  ctx.globalAlpha = fade;
  header(s, t);
  s.draw(t, s.cues.map(q => q.t), s);
  ctx.restore();
  progressDots(s.idx);
  const q = cueOf(s, t);
  if (q && !poster && (wideCaptions || textHook)) drawCaption(q.text, Math.min(P(t, q.t, 0.25), 1 - P(t, q.t + q.d - 0.15, 0.15)));
  return { s, q };
}

/* ================================================================
   Fonts
   ================================================================ */
async function fontsReady() {
  if (!document.fonts) return;
  const sample = '一个回答的诞生期末考试 token 0123';
  const faces = ['400 20px "Noto Sans SC"', '700 20px "Noto Sans SC"', '700 20px "Noto Serif SC"', '400 20px "Long Cang"', '400 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'];
  // Canvas text does not trigger unicode-range chunks on its own, so load every face up front.
  const all = Promise.all([
    ...faces.map(f => document.fonts.load(f, sample).catch(() => null)),
    ...[...document.fonts].map(f => f.load().catch(() => null)),
  ]);
  await Promise.race([all, new Promise(r => setTimeout(r, 4000))]);
  await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
}

/* ================================================================
   Export hooks (used to render the MP4 frame by frame)
   ================================================================ */
if (EXPORT) {
  fit();
  window.__video = {
    total: TOTAL,
    ready: fontsReady().then(() => true),
    frame(t) { render(t); return cv.toDataURL('image/jpeg', 0.93); },
    cues() { return SCENES.flatMap(s => s.cues.map(q => ({ start: s.start + q.t, end: s.start + q.t + q.d, text: q.text }))); },
    collect() {
      const used = { body: new Set(), display: new Set(), hand: new Set(), mono: new Set() };
      textHook = (kind, s) => { for (const ch of s) used[kind].add(ch); };
      for (let t = 0; t < TOTAL; t += 0.05) render(t);
      textHook = null;
      return Object.fromEntries(Object.entries(used).map(([k, v]) => [k, [...v].join('')]));
    },
  };
  return;
}

/* ================================================================
   Player
   ================================================================ */
const $ = id => document.getElementById(id);
const playBtn = $('play'), bigPlay = $('bigplay'), seek = $('seek'), timeEl = $('time'), ccEl = $('cc'), voiceBtn = $('voice');
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const POSTER = 3.4;
let cur = 0, playing = false, last = null, speed = 1, dirty = true, started = false;
let lastCaption = null, chapterIdx = -1;

const ticks = $('ticks');
SCENES.forEach(s => { const i = document.createElement('i'); i.style.left = `calc(${(s.start / TOTAL) * 100}% - 1px)`; ticks.appendChild(i); });
const list = $('chapters');
const chapterBtns = SCENES.map((s, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span class="n">${String(i).padStart(2, '0')}</span><span>${s.chapter}</span><span class="t">${fmt(s.start)}</span>`;
  b.addEventListener('click', () => { seekTo(s.start + 0.01); if (!playing) play(); });
  li.appendChild(b);
  list.appendChild(li);
  return b;
});

/* optional read-aloud with the device's own Chinese voice; time waits for the voice */
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voiceOn = false, zhVoice = null, spokenKey = null, speechDone = true, holdSince = 0, utter = null, spokenEnd = 0;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; } else voiceBtn.hidden = true;
function stopSpeech() { if (synth) synth.cancel(); spokenKey = null; speechDone = true; utter = null; }
function speak(textToSay) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(textToSay.replace(/token/g, 'token '));
  u.lang = 'zh-CN';
  if (zhVoice) u.voice = zhVoice;
  u.rate = Math.min(2, 1.05 * speed);
  u.onend = u.onerror = () => { if (utter === u) speechDone = true; };
  utter = u; speechDone = false; holdSince = 0;
  synth.speak(u);
}
voiceBtn.addEventListener('click', () => {
  voiceOn = !voiceOn;
  voiceBtn.setAttribute('aria-pressed', String(voiceOn));
  voiceBtn.textContent = voiceOn ? '朗读字幕：开' : '朗读字幕';
  if (!voiceOn) stopSpeech();
});

function play() {
  if (cur >= TOTAL - 0.05) cur = 0;
  playing = true; started = true; last = null; dirty = true;
  playBtn.textContent = '暂停';
  bigPlay.hidden = true;
}
function pause() {
  playing = false;
  playBtn.textContent = cur >= TOTAL - 0.05 ? '重播' : '播放';
  bigPlay.hidden = false;
  stopSpeech();
  dirty = true;
}
function toggle() { playing ? pause() : play(); }
function seekTo(t) { cur = clamp(t, 0, TOTAL); started = true; stopSpeech(); dirty = true; }

playBtn.addEventListener('click', toggle);
bigPlay.addEventListener('click', e => { e.stopPropagation(); toggle(); });
cv.addEventListener('click', toggle);
seek.addEventListener('input', () => seekTo(seek.value / 1000 * TOTAL));
$('speed').addEventListener('change', e => { speed = parseFloat(e.target.value) || 1; });
$('fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else stage.requestFullscreen?.().catch(() => {});
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea', 'button'].includes(tag)) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(cur + 5); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(cur - 5); }
});
let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); dirty = true; }, 80); });
document.addEventListener('fullscreenchange', () => { setTimeout(() => { fit(); dirty = true; }, 60); });

function tick(ts) {
  if (playing) {
    if (last != null) {
      let next = cur + Math.min(0.1, (ts - last) / 1000) * speed;
      if (voiceOn && synth) {
        const s = sceneAt(cur), q = cueOf(s, cur - s.start);
        const key = q ? `${s.idx}:${q.i}` : null;
        if (key && key !== spokenKey) { spokenKey = key; spokenEnd = s.start + q.t + q.d - 0.05; speak(q.text); }
        if (!speechDone && next > spokenEnd) {
          if (!holdSince) holdSince = ts;
          if (ts - holdSince < 9000) next = Math.max(cur, spokenEnd);
        }
      }
      cur = Math.min(TOTAL, next);
      dirty = true;
      if (cur >= TOTAL) pause();
    }
    last = ts;
  } else last = null;

  if (dirty) {
    dirty = false;
    const { s, q } = render(started ? cur : POSTER, !started);
    seek.value = String(Math.round(cur / TOTAL * 1000));
    timeEl.textContent = `${fmt(cur)} / ${fmt(TOTAL)}`;
    const capText = started && q ? q.text : '';
    if (capText !== lastCaption) { lastCaption = capText; ccEl.textContent = capText; }
    const ci = started ? s.idx : 0;
    if (ci !== chapterIdx) {
      chapterIdx = ci;
      chapterBtns.forEach((b, i) => b.setAttribute('aria-current', String(i === ci)));
    }
  }
  requestAnimationFrame(tick);
}

fit();
timeEl.textContent = `0:00 / ${fmt(TOTAL)}`;
fontsReady().then(() => { dirty = true; requestAnimationFrame(tick); });
})();
</script>
