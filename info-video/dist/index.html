/* Layout: one column. A paper "stage" plays the video; controls sit under it; the chapter index follows. */
:root {
  --bg: #e6ebe5;
  --surface: #f3f6f1;
  --fg: #1d2420;
  --muted: #56615b;
  --ink: #233e91;
  --red: #c4372c;
  --line: #c4d0c5;
  --stage-paper: #1e2a2b;
  --stage-ink: #f2d06b;
  --stage-on-ink: #1e2a2b;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", "Noto Sans SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, "Noto Sans SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --surface: #18201c; --fg: #e1e8e2; --muted: #9ba89f;
    --ink: #a3b6ff; --red: #ff8174; --line: #2c3832; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --surface: #18201c; --fg: #e1e8e2; --muted: #9ba89f;
  --ink: #a3b6ff; --red: #ff8174; --line: #2c3832; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 22px; }
.intro { display: grid; gap: 6px; }
.eyebrow { margin: 0; font-size: 13px; letter-spacing: .14em; color: var(--muted); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(36px, 6vw, 58px); line-height: 1.12; color: var(--ink); text-wrap: balance; }
.lede { margin: 0; max-width: 62ch; color: var(--muted); }

.player { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage { position: relative; background: var(--stage-paper); cursor: pointer; }

      ctx.beginPath(); ctx.moveTo(270, 380); ctx.lineTo(230, 520); ctx.moveTo(340, 334); ctx.lineTo(380, 520); ctx.moveTo(200, 520); ctx.lineTo(410, 520); ctx.stroke();
    });
    text('号角天线', 270, 556, { size: 20, color: C.pencil, align: 'center', alpha: kh });

    const kn = P(t, c[0] + 0.6, 0.6), cmb = P(t, c[2] + 0.2, 0.8);
    if (kn > 0) {
      const pts = [], frame = Math.floor(t * 18);
      for (let x = 470; x <= 1200; x += 5) pts.push([x, 318 + (rnd(x * 0.37 + frame * 13.1) - 0.5) * 52 * kn]);
      strokePts(pts, P(t, c[0] + 0.6, 0.8, E.lin), { color: cmb > 0.5 ? C.ink : C.pencil, width: 2 });
    }
    text('嘶嘶嘶……', 480, 252, { size: 26, color: C.pencil, alpha: P(t, c[0] + 1.2, 0.5) });

    text('1964 · 贝尔实验室', 150, 170, { f: 'hand', size: 32, color: C.pencil, alpha: P(t, c[1] + 0.2, 0.5) });
    const fly = P(t, c[1] + 5.0, 1.6, E.inOut);
    [[250, 268], [300, 288]].forEach(([x, y], i) => bird(x - fly * (160 + i * 60), y - fly * (190 + i * 40), 12, P(t, c[1] + 1.0 + i * 0.3, 0.4) * (1 - fly)));
    text('请走鸽子', 330, 216, { f: 'hand', size: 28, color: C.pencil, alpha: P(t, c[1] + 4.2, 0.4) * (1 - P(t, c[1] + 7.0, 0.5)) });
    text('还在！', 1080, 236, { f: 'hand', size: 40, color: C.red, alpha: P(t, c[1] + 7.4, 0.4) });

    text('宇宙微波背景：大爆炸的余晖', 840, 420, { size: 28, wt: 700, color: C.ink, align: 'center', alpha: P(t, c[2] + 0.6, 0.6) });
    text('约 2.7 K，从天空的每个方向均匀传来', 840, 462, { size: 20, color: C.pencil, align: 'center', alpha: P(t, c[2] + 1.4, 0.6) });
    text('1978 · 诺贝尔物理学奖', 840, 512, { f: 'hand', size: 32, color: C.red, align: 'center', alpha: P(t, c[2] + 3.0, 0.6) });
  },
});

/* ---------- 7 · 带走三句话 ---------- */
SCENES.push({
  chapter: '带走三句话', title: '带走三句话',
  caps: [
    '所以，想知道自己知不知道：看答案之前先猜，看完之后量一量自己的惊奇。',
    '不惊奇的地方，说明你已经懂了；惊奇的地方，就是你该去的地方。',
    '下次被答案吓一跳，别难过。那一刻，正是你学到最多的时候。',
  ],
  hold: [1.0, 0.8, 0],
  extra: 3.0,
  last: true,
  draw(t, c) {
    const lines = [
      ['看答案之前，先猜，并写下把握', c[0] + 0.5],
      ['看完之后，量一量自己的惊奇', c[0] + 3.6],
      ['不惊奇处已经懂了，惊奇处才是要去的地方', c[1] + 0.4],
    ];
    lines.forEach(([s, at], i) => {
      const y = 170 + i * 88, k = P(t, at, 0.5);
      strokePts(ellipsePts(196, y, 24, 22, i + 2), P(t, at, 0.5, E.inOut), { color: C.red, width: 2.6 });
      text(String(i + 1), 196, y + 2, { f: 'mono', size: 24, wt: 600, color: C.red, align: 'center', alpha: k });
      write(s, 244, y, P(t, at + 0.1, 1.0, E.lin), { f: 'display', size: 36, color: C.text });
    });
    const fin = '被吓一跳的时候，你学到的最多。', fo = { f: 'display', size: 50 }, fw = measure(fin, fo);
    marker(640 - fw / 2 - 12, 490, fw + 24, 26, P(t, c[2] + 2.0, 0.8, E.inOut), C.hl[0], 9);
    write(fin, 640, 476, P(t, c[2] + 0.5, 1.4, E.lin), { ...fo, color: C.ink, align: 'center' });
    text('—— Claude', 1180, 548, { f: 'display', size: 28, color: C.red, align: 'right', alpha: P(t, c[2] + 2.8, 0.6) });
  },
});

/* ================================================================
   Timeline
   ================================================================ */
const LEAD = 0.8, TAIL = 0.9;
let TOTAL = 0;
SCENES.forEach((s, idx) => {
  s.idx = idx;
  s.start = TOTAL;
  s.cues = [];
  let t = LEAD;
  s.caps.forEach((cap, i) => {
    const d = Math.max(2.8, 1.1 + Array.from(cap).length / 5) + (s.hold?.[i] || 0);
    s.cues.push({ t, d, text: cap });
    t += d;
  });
  s.dur = t + TAIL + (s.extra || 0);
  TOTAL += s.dur;
});
function sceneAt(time) {
  for (let i = SCENES.length - 1; i >= 0; i--) if (time >= SCENES[i].start) return SCENES[i];
  return SCENES[0];
}
function cueOf(s, lt) {
  for (let i = 0; i < s.cues.length; i++) { const q = s.cues[i]; if (lt >= q.t && lt < q.t + q.d) return { ...q, i }; }
  return null;
}

/* ================================================================
   Frame
   ================================================================ */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
ctx = cv.getContext('2d');
let scale = 1, paper = null, wideCaptions = true;

function makePaper() {
  paper = document.createElement('canvas');
  paper.width = cv.width; paper.height = cv.height;
  const p = paper.getContext('2d');
  p.scale(scale, scale);
  p.fillStyle = C.paper; p.fillRect(0, 0, W, H);
  // old chalk smudges and dust, fixed so every frame matches
  for (let i = 0; i < 14; i++) {
    const x = rnd(i * 3.3) * W, y = rnd(i * 7.1) * H, r = 120 + rnd(i * 5.7) * 260;
    const g = p.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(236,239,230,0.035)'); g.addColorStop(1, 'rgba(236,239,230,0)');
    p.fillStyle = g; p.fillRect(0, 0, W, H);
  }
  p.fillStyle = 'rgba(236,239,230,0.06)';
  for (let i = 0; i < 2400; i++) p.fillRect(rnd(i * 1.37) * W, rnd(i * 2.71 + 9) * H, 1.2, 1.2);
  const v = p.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.28)');
  p.fillStyle = v; p.fillRect(0, 0, W, H);
}
function fit() {
  if (EXPORT) { cv.width = 1920; cv.height = 1080; scale = 1.5; wideCaptions = true; makePaper(); return; }
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(320, Math.round(r.width * dpr));
  cv.width = cw; cv.height = Math.round(cw * 9 / 16);
  scale = cv.width / W;
  wideCaptions = r.width >= 640;
  document.getElementById('cc').classList.toggle('wide', wideCaptions);
  makePaper();
}
function header(s, t) {
  if (!s.title) return;
  const x = s.num ? 128 : 72;
  if (s.num) {
    strokePts(ellipsePts(88, 64, 25, 23, s.num), P(t, 0.05, 0.5, E.inOut), { color: C.red, width: 2.6 });
    text(String(s.num), 88, 66, { f: 'mono', size: 26, wt: 600, color: C.red, align: 'center', alpha: P(t, 0.2, 0.4) });
  }
  write(s.title, x, 64, P(t, 0.15, 0.8, E.lin), { f: 'display', size: 40, color: C.ink });
}
function progressDots(idx) {
  const n = SCENES.length, x0 = 1222 - (n - 1) * 18;
  for (let i = 0; i < n; i++) dot(x0 + i * 18, 62, i === idx ? 6 : 4, i <= idx ? C.ink : C.gridBold, i < idx ? 0.5 : 1);
}
function splitCaption(s, maxW, o) {
  if (measure(s, o) <= maxW) return [s];
  const ch = Array.from(s), mid = ch.length / 2;
  let best = -1, bestD = 1e9;
  ch.forEach((c, i) => {
    if ('，。：；？！、'.includes(c) && i < ch.length - 1) { const d = Math.abs(i + 1 - mid); if (d < bestD) { bestD = d; best = i + 1; } }
  });
  if (best < 0 || bestD > ch.length * 0.3) best = Math.ceil(mid);
  return [ch.slice(0, best).join(''), ch.slice(best).join('')];
}
function drawCaption(s, a) {
  if (a <= 0) return;
  const o = { size: 28 };
  const lines = splitCaption(s, 1080, o);
  const lh = 40, padY = 13;
  const bw = Math.max(...lines.map(l => measure(l, o))) + 56, bh = lines.length * lh + padY * 2;
  const y = H - 22 - bh;
  box(640 - bw / 2, y, bw, bh, { fill: C.capBg, stroke: C.gridBold, lw: 1.5, r: 12, alpha: a });
  lines.forEach((l, i) => text(l, 640, y + padY + lh / 2 + i * lh + 1, { ...o, align: 'center', color: C.text, alpha: a }));
}
function render(time, poster = false) {
  time = clamp(time, 0, TOTAL - 1e-4);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(paper, 0, 0);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const s = sceneAt(time), t = time - s.start;
  const fade = Math.min(P(t, 0, 0.5, E.inOut), s.last ? 1 : 1 - P(t, s.dur - 0.5, 0.5, E.inOut));
  ctx.save();
  ctx.globalAlpha = fade;
  header(s, t);
  s.draw(t, s.cues.map(q => q.t), s);
  ctx.restore();
  progressDots(s.idx);
  const q = cueOf(s, t);
  if (q && !poster && (wideCaptions || textHook)) drawCaption(q.text, Math.min(P(t, q.t, 0.25), 1 - P(t, q.t + q.d - 0.15, 0.15)));
  return { s, q };
}

/* ================================================================
   Fonts
   ================================================================ */
async function fontsReady() {
  if (!document.fonts) return;
  const sample = '惊奇的单位比特信息论 0123';
  const faces = ['400 20px "Noto Sans SC"', '700 20px "Noto Sans SC"', '700 20px "Noto Serif SC"', '400 20px "Long Cang"', '400 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'];
  // Canvas text does not trigger unicode-range chunks on its own, so load every face up front.
  const all = Promise.all([
    ...faces.map(f => document.fonts.load(f, sample).catch(() => null)),
    ...[...document.fonts].map(f => f.load().catch(() => null)),
  ]);
  await Promise.race([all, new Promise(r => setTimeout(r, 4000))]);
  await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
}

/* ================================================================
   Export hooks (used to render the MP4 frame by frame)
   ================================================================ */
if (EXPORT) {
  fit();
  window.__video = {
    total: TOTAL,
    ready: fontsReady().then(() => true),
    frame(t) { render(t); return cv.toDataURL('image/jpeg', 0.93); },
    cues() { return SCENES.flatMap(s => s.cues.map(q => ({ start: s.start + q.t, end: s.start + q.t + q.d, text: q.text }))); },
    collect() {
      const used = { body: new Set(), display: new Set(), hand: new Set(), mono: new Set() };
      textHook = (kind, s) => { for (const ch of s) used[kind].add(ch); };
      for (let t = 0; t < TOTAL; t += 0.05) render(t);
      textHook = null;
      return Object.fromEntries(Object.entries(used).map(([k, v]) => [k, [...v].join('')]));
    },
  };
  return;
}

/* ================================================================
   Player
   ================================================================ */
const $ = id => document.getElementById(id);
const playBtn = $('play'), bigPlay = $('bigplay'), seek = $('seek'), timeEl = $('time'), ccEl = $('cc'), voiceBtn = $('voice');
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const POSTER = 3.0;
let cur = 0, playing = false, last = null, speed = 1, dirty = true, started = false;
let lastCaption = null, chapterIdx = -1;

const ticks = $('ticks');
SCENES.forEach(s => { const i = document.createElement('i'); i.style.left = `calc(${(s.start / TOTAL) * 100}% - 1px)`; ticks.appendChild(i); });
const list = $('chapters');
const chapterBtns = SCENES.map((s, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span class="n">${String(i).padStart(2, '0')}</span><span>${s.chapter}</span><span class="t">${fmt(s.start)}</span>`;
  b.addEventListener('click', () => { seekTo(s.start + 0.01); if (!playing) play(); });
  li.appendChild(b);
  list.appendChild(li);
  return b;
});

/* optional read-aloud with the device's own Chinese voice; time waits for the voice */
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voiceOn = false, zhVoice = null, spokenKey = null, speechDone = true, holdSince = 0, utter = null, spokenEnd = 0;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; } else voiceBtn.hidden = true;
function stopSpeech() { if (synth) synth.cancel(); spokenKey = null; speechDone = true; utter = null; }
function speak(textToSay) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(textToSay.replace(/token/g, 'token '));
  u.lang = 'zh-CN';
  if (zhVoice) u.voice = zhVoice;
  u.rate = Math.min(2, 1.05 * speed);
  u.onend = u.onerror = () => { if (utter === u) speechDone = true; };
  utter = u; speechDone = false; holdSince = 0;
  synth.speak(u);
}
voiceBtn.addEventListener('click', () => {
  voiceOn = !voiceOn;
  voiceBtn.setAttribute('aria-pressed', String(voiceOn));
  voiceBtn.textContent = voiceOn ? '朗读字幕：开' : '朗读字幕';
  if (!voiceOn) stopSpeech();
});

function play() {
  if (cur >= TOTAL - 0.05) cur = 0;
  playing = true; started = true; last = null; dirty = true;
  playBtn.textContent = '暂停';
  bigPlay.hidden = true;
}
function pause() {
  playing = false;
  playBtn.textContent = cur >= TOTAL - 0.05 ? '重播' : '播放';
  bigPlay.hidden = false;
  stopSpeech();
  dirty = true;
}
function toggle() { playing ? pause() : play(); }
function seekTo(t) { cur = clamp(t, 0, TOTAL); started = true; stopSpeech(); dirty = true; }

playBtn.addEventListener('click', toggle);
bigPlay.addEventListener('click', e => { e.stopPropagation(); toggle(); });
cv.addEventListener('click', toggle);
seek.addEventListener('input', () => seekTo(seek.value / 1000 * TOTAL));
$('speed').addEventListener('change', e => { speed = parseFloat(e.target.value) || 1; });
$('fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else stage.requestFullscreen?.().catch(() => {});
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'select', 'textarea', 'button'].includes(tag)) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seekTo(cur + 5); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seekTo(cur - 5); }
});
let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); dirty = true; }, 80); });
document.addEventListener('fullscreenchange', () => { setTimeout(() => { fit(); dirty = true; }, 60); });

function tick(ts) {
  if (playing) {
    if (last != null) {
      let next = cur + Math.min(0.1, (ts - last) / 1000) * speed;
      if (voiceOn && synth) {
        const s = sceneAt(cur), q = cueOf(s, cur - s.start);
        const key = q ? `${s.idx}:${q.i}` : null;
        if (key && key !== spokenKey) { spokenKey = key; spokenEnd = s.start + q.t + q.d - 0.05; speak(q.text); }
        if (!speechDone && next > spokenEnd) {
          if (!holdSince) holdSince = ts;
          if (ts - holdSince < 9000) next = Math.max(cur, spokenEnd);
        }
      }
      cur = Math.min(TOTAL, next);
      dirty = true;
      if (cur >= TOTAL) pause();
    }
    last = ts;
  } else last = null;

  if (dirty) {
    dirty = false;
    const { s, q } = render(started ? cur : POSTER, !started);
    seek.value = String(Math.round(cur / TOTAL * 1000));
    timeEl.textContent = `${fmt(cur)} / ${fmt(TOTAL)}`;
    const capText = started && q ? q.text : '';
    if (capText !== lastCaption) { lastCaption = capText; ccEl.textContent = capText; }
    const ci = started ? s.idx : 0;
    if (ci !== chapterIdx) {
      chapterIdx = ci;
      chapterBtns.forEach((b, i) => b.setAttribute('aria-current', String(i === ci)));
    }
  }
  requestAnimationFrame(tick);
}

fit();
timeEl.textContent = `0:00 / ${fmt(TOTAL)}`;
fontsReady().then(() => { dirty = true; requestAnimationFrame(tick); });
})();
</script>
