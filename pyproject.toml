[project]
name = "svsim"
version = "0.1.0"
description = "Shadowverse: Worlds Beyond rules simulator for training AI practice partners"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]                   # learn.fit, learn.phased, learn.net and their tests

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["svsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
